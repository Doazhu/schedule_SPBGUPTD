# Начальная HTTP-конфигурация. Перед установкой проверьте, что этот server_name
# ещё не занят, а путь root указывает на подготовленную сборку сайта.
server {
    listen 80;
    listen [::]:80;
    server_name preview.schedule.doazhu.pro;

    root /var/www/preview.schedule.doazhu.pro;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
